# profiles/slurm/config.yaml

executor: slurm

default-resources:
  - slurm_partition=medium
  - slurm_extra="--ntasks=1 --no-requeue"
  - runtime="12:00:00"
  # - slurm_account="<your_account>"   # uncomment and set if required by your cluster
    # slurm_partition: default SLURM partition for each job. Set to a partition with a 12-24 h time limit.
    # slurm_extra: --ntasks=1 recommended (BeeGees rules are single-task); --no-requeue prevents auto-requeue on failure (conflicts with snakemake retry/memory scaling).
    # runtime: default wall-clock limit passed to sbatch -t. Override per-rule via the rules: block in config.yaml.
    # slurm_account: uncomment if your cluster requires an explicit account (-A flag). Run `sacctmgr show user $USER` to find your account name.

# Job submission settings
jobs: 20                                      # Maximum number of cluster jobs Snakemake will have running or pending at once.
local-cores: 1                                # Number of CPU cores to use on the head/login node for Snakemake’s own internal tasks. Recommended to keep at 1).

# Status checking settings 
latency-wait: 120                             # Sets how long snakemake waits for output files after job completion (in seconds). Recommended for networked file systems.
seconds-between-status-checks: 60             # Interval between SLURM status queries (in seconds)
max-status-checks-per-second: 0.01            # Throttle rate of SLURM status polling. Prevents overwhelming cluster node running snakemake_run script.

